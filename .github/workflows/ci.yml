name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 没有第三方依赖：测试只用 node 内置模块 + 手搓假 DOM，不联网
      - name: 语法检查
        run: npm run check

      - name: 单元测试
        run: npm test
